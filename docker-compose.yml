# Docker Compose for Streamply VOD Platform
# NGINX Reverse Proxy + Node.js Backend + PostgreSQL + Redis

services:
  # NGINX Reverse Proxy (Frontend + API Gateway)
  nginx:
    image: nginx:alpine
    container_name: streamply-nginx
    ports:
      - "80:80"
      # - "443:443"  # Commented out until we have proper SSL certificates
    volumes:
      - ./nginx/streamply.conf:/etc/nginx/conf.d/default.conf
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # Commented out for development
      - ./streamply-frontend/build:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - streamply-network
    restart: unless-stopped
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.streamply.service=nginx"
      - "com.streamply.description=Reverse proxy and static file server"

  # Node.js Backend API
  backend:
    build:
      context: ./streamply-backend
      dockerfile: Dockerfile
    container_name: streamply-backend
    expose:
      - "3001"
    volumes:
      - /tmp/streamply:/tmp/streamply  # Video processing temp directory
      - ./streamply-backend:/app
      - /app/node_modules  # Anonymous volume for node_modules
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://streamply:streamply_secure_2024@postgres:5432/streamply_prod
      - MONGODB_URI=mongodb://mongo:27017/streamply_logs
      - JWT_SECRET=${JWT_SECRET}
      - B2_APPLICATION_KEY_ID=${B2_APPLICATION_KEY_ID}
      - B2_APPLICATION_KEY=${B2_APPLICATION_KEY}
      - B2_BUCKET_ID=${B2_BUCKET_ID}
      - B2_BUCKET_NAME=${B2_BUCKET_NAME}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FRONTEND_URL=http://localhost
      - CORS_ORIGIN=http://localhost
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - mongo
      - redis
    networks:
      - streamply-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.streamply.service=backend"
      - "com.streamply.description=Node.js API server with video processing"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: streamply-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./streamply-backend/streamply-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      - POSTGRES_DB=streamply_prod
      - POSTGRES_USER=streamply
      - POSTGRES_PASSWORD=streamply_secure_2024
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    networks:
      - streamply-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamply -d streamply_prod"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.streamply.service=postgres"
      - "com.streamply.description=PostgreSQL database for application data"

  # MongoDB for Security Logging
  mongo:
    image: mongo:7-jammy
    container_name: streamply-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=streamply_logs
    networks:
      - streamply-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.streamply.service=mongo"
      - "com.streamply.description=MongoDB for security event logging"

  # Redis for Caching and Sessions
  redis:
    image: redis:7-alpine
    container_name: streamply-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-streamply_redis_2024}
    networks:
      - streamply-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.streamply.service=redis"
      - "com.streamply.description=Redis for caching and session storage"

  # Adminer for Database Management (Development only)
  adminer:
    image: adminer:latest
    container_name: streamply-adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - streamply-network
    restart: unless-stopped
    profiles:
      - development
    labels:
      - "com.streamply.service=adminer"
      - "com.streamply.description=Database management interface"

  # Monitoring with Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: streamply-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - streamply-network
    restart: unless-stopped
    profiles:
      - monitoring
    labels:
      - "com.streamply.service=prometheus"
      - "com.streamply.description=Metrics collection and monitoring"

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
    labels:
      - "com.streamply.volume=postgres"
  mongo_data:
    driver: local
    labels:
      - "com.streamply.volume=mongo"
  redis_data:
    driver: local
    labels:
      - "com.streamply.volume=redis"
  prometheus_data:
    driver: local
    labels:
      - "com.streamply.volume=prometheus"

# Custom network for service communication
networks:
  streamply-network:
    driver: bridge
    labels:
      - "com.streamply.network=main"
