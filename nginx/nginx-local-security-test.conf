# Local Security Testing nginx Configuration
# Place this file in your nginx conf directory

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    
    # Rate limiting zones for security testing
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=streaming:10m rate=30r/s;
    
    # Main server block for local security testing
    server {
        listen 80;
        server_name localhost 127.0.0.1 streamply.local;
        
        # Security headers (OWASP testing targets)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        
        # Content Security Policy for XSS testing
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://cdn.jsdelivr.net;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            img-src 'self' data: https: blob:;
            font-src 'self' https://fonts.gstatic.com;
            connect-src 'self' https://api.stripe.com https://*.ngrok.io https://*.vercel.app wss: ws:;
            media-src 'self' https: blob:;
            frame-src 'self' https://js.stripe.com;
            object-src 'none';
            base-uri 'self';
            form-action 'self';
        " always;
        
        # Hide server version (security misconfiguration testing)
        server_tokens off;
        
        # File upload limits
        client_max_body_size 2G;
        client_body_timeout 300s;
        client_header_timeout 60s;
        
        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        
        # Main API proxy (to local backend via ngrok)
        location /api/ {
            # Rate limiting for DDoS testing
            limit_req zone=api burst=20 nodelay;
            
            # Remove /api prefix and forward to backend
            rewrite ^/api/(.*)$ /$1 break;
            
            # Proxy to local backend
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Hide backend server info
            proxy_hide_header X-Powered-By;
            add_header X-API-Gateway "nginx-security-test" always;
            
            # CORS for Vercel frontend
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://*.vercel.app";
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
            
            # CORS headers for actual requests
            add_header Access-Control-Allow-Origin "https://*.vercel.app" always;
            add_header Access-Control-Allow-Credentials true always;
        }
        
        # Authentication endpoints (stricter rate limiting for brute force testing)
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Additional security for auth endpoints
            add_header X-Auth-Gateway "secure-test" always;
            
            # CORS for auth
            add_header Access-Control-Allow-Origin "https://*.vercel.app" always;
            add_header Access-Control-Allow-Credentials true always;
        }
        
        # Video upload endpoints (file upload security testing)
        location /api/videos/upload/ {
            limit_req zone=upload burst=3 nodelay;
            
            # Large file upload testing
            client_max_body_size 2G;
            client_body_timeout 600s;
            
            # Extended timeouts
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header X-Upload-Gateway "secure-test" always;
            add_header Access-Control-Allow-Origin "https://*.vercel.app" always;
        }
        
        # Video streaming endpoints (anti-piracy testing)
        location /api/videos/stream/ {
            limit_req zone=streaming burst=50 nodelay;
            
            # Streaming optimizations
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Anti-piracy headers for testing
            add_header X-Stream-Protection "enabled" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin "https://*.vercel.app" always;
            
            # Cache control for HLS segments
            location ~* \.(m3u8|mpd)$ {
                expires 30s;
                add_header Cache-Control "public, max-age=30";
            }
            
            location ~* \.(ts|mp4|webm)$ {
                expires 1h;
                add_header Cache-Control "public, max-age=3600";
            }
        }
        
        # Security endpoints testing
        location /api/security/ {
            limit_req zone=api burst=30 nodelay;
            
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header X-Security-Gateway "active-test" always;
            add_header Access-Control-Allow-Origin "https://*.vercel.app" always;
        }
        
        # Health check for monitoring
        location /health {
            access_log off;
            return 200 "StreamPly Security Testing Environment - OK\n";
            add_header Content-Type text/plain;
        }
        
        # Security testing: Block common attack patterns
        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 403;
        }
        
        # Block access to sensitive files (security misconfiguration testing)
        location ~* \.(env|git|svn|htaccess|htpasswd|ini|log|sql|conf|bak|backup)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 403;
        }
        
        # Block common exploit attempts
        location ~* (eval\(|base64_decode|shell_exec|system\(|wget|curl|<script) {
            deny all;
            access_log off;
            log_not_found off;
            return 403;
        }
        
        # Custom error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            return 404 "Not Found - Security Test Environment";
            add_header Content-Type text/plain;
        }
        
        location = /50x.html {
            return 500 "Server Error - Security Test Environment";
            add_header Content-Type text/plain;
        }
        
        # Comprehensive logging for security analysis
        access_log logs/streamply-security-test.access.log combined;
        error_log logs/streamply-security-test.error.log warn;
    }
}
