# NGINX Log Configuration for Streamply

# Define custom log format with security information
log_format streamply_security '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              '"$http_x_forwarded_for" '
                              'rate_limit=$http_x_rate_limit '
                              'request_time=$request_time '
                              'upstream_response_time=$upstream_response_time';

# Define JSON log format for structured logging
log_format streamply_json escape=json '{'
                          '"time":"$time_iso8601",'
                          '"remote_addr":"$remote_addr",'
                          '"request":"$request",'
                          '"status":$status,'
                          '"body_bytes_sent":$body_bytes_sent,'
                          '"request_time":$request_time,'
                          '"upstream_response_time":"$upstream_response_time",'
                          '"user_agent":"$http_user_agent",'
                          '"referer":"$http_referer",'
                          '"x_forwarded_for":"$http_x_forwarded_for"'
                          '}';

# Rate limiting log format
log_format rate_limit '$remote_addr - [$time_local] '
                      '"$request" $status '
                      'rate_limit_key="$limit_req_status" '
                      'user_agent="$http_user_agent"';

# Security event logging
log_format security_events '$remote_addr - [$time_local] '
                           '"$request" $status '
                           'security_event="$arg_event" '
                           'user_agent="$http_user_agent" '
                           'referer="$http_referer"';

# Video streaming access log
log_format video_access '$remote_addr - [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        'video_id="$arg_id" '
                        'session_id="$arg_session" '
                        'user_agent="$http_user_agent" '
                        'request_time=$request_time';

# Upload tracking log
log_format upload_tracking '$remote_addr - [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           'upload_size=$content_length '
                           'processing_time=$request_time '
                           'user_agent="$http_user_agent"';
