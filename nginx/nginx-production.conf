# 🚀 Production-Grade nginx Configuration for StreamPly
# Enterprise-ready reverse proxy with comprehensive security and performance optimizations

# Core nginx configuration
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;
    
    # Buffer sizes
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 2G;  # For video uploads
    large_client_header_buffers 4 16k;
    
    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;
    
    # SSL/TLS settings (production-grade)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Rate limiting zones (production-tuned)
    limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=streaming:50m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=200r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn_zone $server_name zone=conn_limit_per_server:10m;
    
    # Real IP detection (for Cloudflare/AWS ALB)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    
    # Backend upstream with health checks and load balancing
    upstream streamply_backend {
        least_conn;  # Load balancing method
        
        # Production backend servers (replace with actual IPs/domains)
        server backend-1.streamply.com:3001 max_fails=3 fail_timeout=30s;
        server backend-2.streamply.com:3001 max_fails=3 fail_timeout=30s backup;
        
        # Health check
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }
    
    # Logging format for production monitoring
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    # Security-focused access log
    log_format security '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'country="$geoip2_country_code" city="$geoip2_city_name" '
                       'ssl_protocol="$ssl_protocol" ssl_cipher="$ssl_cipher"';
    
    access_log /var/log/nginx/access.log main;
    
    # Security: Hide nginx version and server info
    more_clear_headers Server;
    more_set_headers "Server: StreamPly";
    
    # Map for maintenance mode
    map $uri $maintenance {
        default 0;
        ~^/maintenance 1;
    }
    
    # GeoIP2 configuration (for security monitoring)
    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        auto_reload 5m;
        $geoip2_metadata_country_build metadata build_epoch;
        $geoip2_country_code country iso_code;
        $geoip2_country_name country names en;
    }
    
    geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
        auto_reload 5m;
        $geoip2_city_name city names en;
    }
    
    # Security: Block common attacks
    map $http_user_agent $blocked_agent {
        default 0;
        ~*malicious 1;
        ~*bot 1;
        ~*crawler 1;
        ~*scanner 1;
        ~*sqlmap 1;
        ~*nikto 1;
        ~*dirb 1;
        ~*nmap 1;
    }
    
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name streamply.com www.streamply.com;
        
        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name streamply.com www.streamply.com;
        
        # SSL certificates (replace with your actual certificates)
        ssl_certificate /etc/ssl/certs/streamply.com.crt;
        ssl_certificate_key /etc/ssl/private/streamply.com.key;
        ssl_trusted_certificate /etc/ssl/certs/streamply.com.chain.crt;
        
        # Security headers (production-grade)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        
        # Content Security Policy (production-ready)
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'sha256-YOUR_INLINE_SCRIPT_HASH' https://js.stripe.com https://www.google-analytics.com;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            img-src 'self' data: https: blob: https://www.google-analytics.com;
            font-src 'self' https://fonts.gstatic.com;
            connect-src 'self' https://api.stripe.com https://www.google-analytics.com;
            media-src 'self' https: blob:;
            frame-src 'self' https://js.stripe.com;
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            upgrade-insecure-requests;
        " always;
        
        # Connection limits
        limit_conn conn_limit_per_ip 20;
        limit_conn conn_limit_per_server 1000;
        
        # Security: Block malicious agents
        if ($blocked_agent) {
            return 403;
        }
        
        # Security: Block requests during maintenance
        if ($maintenance = 1) {
            return 503;
        }
        
        # Frontend static files (React build) with aggressive caching
        location / {
            root /var/www/streamply/build;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Rate limiting for static files
            limit_req zone=static burst=50 nodelay;
            
            # Caching strategy
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary "Accept-Encoding";
                
                # Precompressed files
                gzip_static on;
                brotli_static on;
                
                # Security headers for assets
                add_header X-Content-Type-Options "nosniff";
            }
            
            # HTML files - no caching
            location ~* \.(html|htm)$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                
                # Security headers for HTML
                add_header X-Frame-Options "SAMEORIGIN";
                add_header X-Content-Type-Options "nosniff";
            }
            
            # Service worker
            location = /service-worker.js {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
        
        # API Gateway with comprehensive rate limiting
        location /api/ {
            # Rate limiting with burst handling
            limit_req zone=api burst=100 delay=50;
            limit_req_status 429;
            
            # Security checks
            if ($blocked_agent) {
                return 403;
            }
            
            # Remove /api prefix
            rewrite ^/api/(.*)$ /$1 break;
            
            # Proxy to backend cluster
            proxy_pass http://streamply_backend;
            
            # Proxy headers (production-grade)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;
            
            # Security headers for API
            proxy_hide_header X-Powered-By;
            add_header X-API-Gateway "nginx-prod" always;
            add_header X-Request-ID $request_id always;
            
            # Proxy settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Health check
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;
        }
        
        # Authentication endpoints with strict rate limiting
        location ~ ^/api/(auth|users)/(signin|signup|login|register|reset) {
            limit_req zone=auth burst=20 delay=10;
            limit_req_status 429;
            
            # Additional security for auth
            add_header X-Auth-Endpoint "protected" always;
            
            # Proxy to backend
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://streamply_backend;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
        
        # Video streaming with optimized settings
        location ~ ^/api/videos?/(stream|hls) {
            limit_req zone=streaming burst=200 delay=100;
            
            # Streaming optimizations
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            # Extended timeouts for video processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Proxy to backend
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://streamply_backend;
            
            # Streaming headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Video-specific headers
            add_header X-Stream-Server "nginx-prod" always;
            add_header X-Accel-Buffering "no";
        }
        
        # File upload endpoints
        location ~ ^/api/(videos?|users?)/upload {
            limit_req zone=upload burst=10 delay=5;
            
            # Large file handling
            client_max_body_size 2G;
            client_body_timeout 300s;
            proxy_request_buffering off;
            
            # Extended timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Proxy to backend
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://streamply_backend;
            
            # Upload headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header X-Upload-Server "nginx-prod" always;
        }
        
        # Admin endpoints with extra security
        location /api/admin/ {
            # Very strict rate limiting
            limit_req zone=api burst=20 delay=10;
            
            # IP whitelist (replace with your admin IPs)
            # allow 203.0.113.0/24;  # Office network
            # allow 198.51.100.0/24; # VPN network
            # deny all;
            
            # Additional security headers
            add_header X-Admin-Access "monitored" always;
            add_header X-Security-Level "maximum" always;
            
            # Proxy to backend
            rewrite ^/api/admin/(.*)$ /admin/$1 break;
            proxy_pass http://streamply_backend;
            
            # Admin proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Admin-Request "true";
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"healthy","server":"nginx-prod","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
        
        # Nginx status (restrict access)
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
        
        # Security: Block common attack vectors
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ \.(env|git|htaccess|htpasswd|ini|config|bak|swp)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Error pages
        error_page 404 /404.html;
        error_page 403 /403.html;
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /var/www/streamply/error-pages;
            internal;
        }
        
        location = /403.html {
            root /var/www/streamply/error-pages;
            internal;
        }
        
        location = /429.html {
            root /var/www/streamply/error-pages;
            internal;
            add_header Retry-After 60;
        }
        
        location = /50x.html {
            root /var/www/streamply/error-pages;
            internal;
        }
    }
    
    # Maintenance page server
    server {
        listen 80;
        listen 443 ssl http2;
        server_name maintenance.streamply.com;
        
        ssl_certificate /etc/ssl/certs/streamply.com.crt;
        ssl_certificate_key /etc/ssl/private/streamply.com.key;
        
        root /var/www/maintenance;
        index index.html;
        
        location / {
            return 503;
        }
        
        error_page 503 @maintenance;
        
        location @maintenance {
            rewrite ^(.*)$ /maintenance.html break;
        }
    }
}
