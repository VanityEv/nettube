# Public Security Testing nginx Configuration
# Proxy configuration for external ngrok tunnel testing

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    
    # Rate limiting zones for public security testing
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=streaming:10m rate=30r/s;
    
    # Upstream backend through ngrok tunnel
    upstream backend {
        # Replace with your actual ngrok backend URL (without https://)
        server streamply-backend-test.ngrok.io:443;
    }
    
    # Main server block for public security testing
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        
        # Security headers for OWASP testing
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Content Security Policy for comprehensive testing
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://cdn.jsdelivr.net https://*.ngrok.io;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
            img-src 'self' data: https: blob: https://*.ngrok.io;
            font-src 'self' https://fonts.gstatic.com;
            connect-src 'self' https://api.stripe.com https://*.ngrok.io https://*.vercel.app wss: ws:;
            media-src 'self' https: blob: https://*.ngrok.io;
            frame-src 'self' https://js.stripe.com;
            object-src 'none';
            base-uri 'self';
            form-action 'self';
        " always;
        
        # Hide server version for security testing
        server_tokens off;
        
        # Custom headers for proxy identification
        add_header X-Proxy-Server "nginx-security-test" always;
        add_header X-Testing-Environment "public-security-testing" always;
        
        # File upload limits
        client_max_body_size 100M;
        client_body_timeout 60s;
        
        # Health check endpoint
        location /health {
            return 200 '{"status":"healthy","proxy":"nginx","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
        
        # Proxy status endpoint
        location /proxy-status {
            return 200 '{"proxy":"nginx","backend":"ngrok-tunnel","rate_limits":"active","security_headers":"enabled"}';
            add_header Content-Type application/json;
        }
        
        # API endpoints with rate limiting
        location /api/ {
            # Apply rate limiting
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            
            # Proxy to ngrok backend tunnel
            proxy_pass https://backend/;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;  # ngrok uses its own certificates
            
            # Proxy headers
            proxy_set_header Host streamply-backend-test.ngrok.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Security headers for proxied content
            proxy_hide_header X-Powered-By;
            add_header X-Proxy-Cache $upstream_cache_status;
        }
        
        # Authentication endpoints with strict rate limiting
        location ~ ^/api/(auth|users)/(signin|signup|login|register) {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            
            proxy_pass https://backend;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            
            proxy_set_header Host streamply-backend-test.ngrok.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Additional security for auth endpoints
            add_header X-Auth-Endpoint "protected" always;
        }
        
        # Video streaming endpoints with specialized rate limiting
        location ~ ^/api/videos?/stream {
            limit_req zone=streaming burst=10 nodelay;
            limit_req_status 429;
            
            proxy_pass https://backend;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            
            proxy_set_header Host streamply-backend-test.ngrok.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Streaming-specific headers
            add_header X-Stream-Proxy "nginx" always;
            proxy_buffering off;  # Disable buffering for streaming
        }
        
        # File upload endpoints with strict limits
        location ~ ^/api/(videos?|users?)/upload {
            limit_req zone=upload burst=3 nodelay;
            limit_req_status 429;
            
            # Larger timeout for uploads
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            proxy_pass https://backend;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            
            proxy_set_header Host streamply-backend-test.ngrok.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Upload-specific security
            add_header X-Upload-Proxy "nginx" always;
        }
        
        # Admin endpoints with additional protection
        location /api/admin/ {
            # Very strict rate limiting for admin
            limit_req zone=api burst=5 nodelay;
            limit_req_status 429;
            
            proxy_pass https://backend/admin/;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            
            proxy_set_header Host streamply-backend-test.ngrok.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Admin security headers
            add_header X-Admin-Access "monitored" always;
            add_header X-Security-Level "high" always;
        }
        
        # Block common attack patterns
        location ~ \.(env|git|htaccess|config)$ {
            deny all;
            return 404;
        }
        
        # Block suspicious user agents
        if ($http_user_agent ~* (sqlmap|nmap|nikto|dirb|gobuster)) {
            return 403;
        }
        
        # Default location for any unmatched routes
        location / {
            proxy_pass https://backend/;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            
            proxy_set_header Host streamply-backend-test.ngrok.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Custom error pages for security testing
        error_page 404 /404.html;
        error_page 403 /403.html;
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            return 404 '{"error":"Not Found","proxy":"nginx","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
        
        location = /403.html {
            return 403 '{"error":"Forbidden","proxy":"nginx","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
        
        location = /429.html {
            return 429 '{"error":"Rate Limit Exceeded","proxy":"nginx","retry_after":"60","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
            add_header Retry-After 60;
        }
        
        location = /50x.html {
            return 500 '{"error":"Server Error","proxy":"nginx","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
    }
    
    # Access logging for security analysis
    log_format security_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time" '
                           'proxy="nginx" backend="ngrok-tunnel"';
    
    access_log logs/access.log security_log;
    error_log logs/error.log warn;
}
